<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AZEMAC Properties</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <span>AZEMAC</span> Properties
            </div>

            <h1>Set New Password</h1>

            <p class="login-subtitle">
                Choose a new password for your admin account
            </p>

            <form id="newPasswordForm">

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="New password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password" minlength="6" required>
                </div>

                <button type="submit" class="login-btn">
                    Save New Password
                </button>

                <p id="resetMessage"></p>

            </form>

            <a href="login.html" class="back-home">
                ← Back to login
            </a>

        </div>

    </div>

    <script src="../js/supabase-client.js"></script>
    <script>

        const newPasswordForm = document.getElementById("newPasswordForm");
        const resetMessage = document.getElementById("resetMessage");

        newPasswordForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmNewPassword = document.getElementById("confirmNewPassword").value;

            if (newPassword !== confirmNewPassword) {
                resetMessage.style.color = "red";
                resetMessage.textContent = "Passwords do not match.";
                return;
            }

            const { error } =
                await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                resetMessage.style.color = "red";
                resetMessage.textContent =
                    "This reset link is invalid or has expired. Please request a new one.";
                return;
            }

            resetMessage.style.color = "green";
            resetMessage.textContent = "Password updated! Redirecting to login...";

            await supabaseClient.auth.signOut();

            setTimeout(function () {
                window.location.href = "login.html";
            }, 2000);

        });

    </script>

</body>

</html>
