<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | AZEMAC Properties</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                <span>AZEMAC</span> Properties
            </div>

            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <div id="loginSection">

                <h1>Admin Login</h1>

                <p class="login-subtitle">
                    Sign in to manage your properties
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Admin email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                    <p id="loginMessage"></p>

                    <a href="#" id="forgotPassword" class="forgot-password">
                        Forgot Password?
                    </a>

                </form>

            </div>

            <!-- =========================
                 FORGOT PASSWORD
            ========================= -->

            <div id="resetRequestSection" style="display: none;">

                <h1>Reset Password</h1>

                <p class="login-subtitle">
                    Enter your admin email and we'll send you a reset link
                </p>

                <form id="resetRequestForm">

                    <div class="form-group">
                        <label for="resetEmail">Admin Email</label>
                        <input type="email" id="resetEmail" placeholder="Admin email" required>
                    </div>

                    <button type="submit" class="login-btn">
                        Send Reset Link
                    </button>

                    <p id="resetRequestMessage"></p>

                    <a href="#" id="backToLoginFromRequest" class="forgot-password">
                        ← Back to Login
                    </a>

                </form>

            </div>

            <a href="../index.html" class="back-home">
                ← Back to website
            </a>

        </div>

    </div>

    <script src="../js/supabase-client.js"></script>
    <script src="admin.js"></script>

</body>

</html>
